# ── Prefix ────────────────────────────────────────────────
# Change prefix from ctrl-b to ctrl-a (easier to reach)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── Vim-like pane navigation ───────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ── Vim-like pane resizing ─────────────────────────────────
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Splitting panes (easier to remember) ──────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# ── Windows ───────────────────────────────────────────────
bind -r [ previous-window
bind -r ] next-window

# ── Reload config ─────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# ── Quality of life ───────────────────────────────────────
set -g mouse on                   # mouse support
set -g base-index 1               # start windows at 1 not 0
setw -g pane-base-index 1         # start panes at 1 not 0
set -g renumber-windows on        # renumber when a window closes
set -s escape-time 0              # no delay for escape key
set -g history-limit 50000        # more scrollback
set -g display-time 1500          # status messages last 1.5s
set -g focus-events on

# ── Appearance ────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# catppuccin mocha colors
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left "#[bg=#89b4fa,fg=#1e1e2e,bold] #S #[default] "
set -g status-right "#[bg=#313244,fg=#cdd6f4] %H:%M #[bg=#89b4fa,fg=#1e1e2e,bold] #h "
set -g status-left-length 20
set -g status-right-length 40
set -g status-position top

# active/inactive window tabs
set -g window-status-current-format "#[bg=#cba6f7,fg=#1e1e2e,bold] #I:#W "
set -g window-status-format "#[bg=#313244,fg=#cdd6f4] #I:#W "

# pane borders
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
